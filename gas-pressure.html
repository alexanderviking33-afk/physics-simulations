<!DOCTYPE html>
<html>
<head>
  <title>Gas Pressure</title>
  <style>
    body { background-color: #0b1d3a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #ffd23f; font-size: 32px; margin: 0 0 5px 0; }
    .subtitle { color: #9fd3ff; font-size: 16px; margin: 0 0 18px 0; }
    .main { display: flex; justify-content: center; align-items: stretch; gap: 18px; margin-bottom: 18px; }
    canvas { background-color: #060f22; border-radius: 14px; display: block; border: 3px solid #3a5a8c; }
    .panel { width: 140px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .meter-wrap { position: relative; width: 90px; flex: 1; background-color: #0a1530; border: 2px solid #3a5a8c; border-radius: 12px; overflow: hidden; }
    .meter-fill { position: absolute; bottom: 0; left: 0; right: 0; height: 0%; background: linear-gradient(to top, #4ea8de 0%, #7be495 30%, #ffd23f 65%, #e63946 100%); transition: height 0.10s linear; }
    .meter-label { color: #ffd23f; font-weight: bold; font-size: 13px; letter-spacing: 1px; }
    .pressure-text { color: #9fd3ff; font-size: 14px; line-height: 1.3; }
    .pressure-text span { color: #ffd23f; font-weight: bold; font-size: 22px; }
    .pressure-text small { color: #9fd3ff; font-size: 12px; }
    .controls { display: inline-block; background-color: #132a4f; border-radius: 14px; padding: 14px 24px; margin-bottom: 16px; }
    .slider-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 8px 0; font-size: 15px; }
    .slider-row label { color: #9fd3ff; min-width: 170px; text-align: left; }
    .slider-row input[type="range"] { width: 240px; accent-color: #ffd23f; }
    .slider-row span { color: #ffd23f; font-weight: bold; min-width: 50px; text-align: right; }
    .buttons { margin-top: 10px; display: flex; justify-content: center; gap: 10px; }
    button { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; padding: 8px 22px; border: none; border-radius: 10px; cursor: pointer; color: #0b1d3a; background-color: #ffd23f; transition: transform 0.1s; }
    button:hover { transform: scale(1.05); }
    button.active { background-color: #e63946; color: #ffffff; }
    .takeaway { display: inline-block; background-color: #1c3d6e; border: 2px solid #ffd23f; border-radius: 12px; padding: 12px 22px; font-size: 16px; max-width: 780px; }
    .takeaway strong { color: #ffd23f; }
  </style>
</head>
<body>
  <h1>Gas Pressure</h1>
  <p class="subtitle">Gas particles move randomly and hit the walls — squeeze the piston and watch the pressure rise</p>
  <div class="main">
    <canvas id="canvas" width="600" height="400"></canvas>
    <div class="panel">
      <div class="meter-wrap"><div class="meter-fill" id="meterFill"></div></div>
      <div class="meter-label">PRESSURE</div>
      <div class="pressure-text"><span id="pressureNum">100</span><br><small>kPa</small></div>
    </div>
  </div>
  <div class="controls">
    <div class="slider-row">
      <label>🌡️ Temperature</label>
      <input type="range" id="tempSlider" min="0.5" max="2.5" step="0.05" value="1">
      <span id="tempVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>🔧 Volume (piston)</label>
      <input type="range" id="volSlider" min="20" max="100" step="1" value="100">
      <span id="volVal">100%</span>
    </div>
    <div class="buttons">
      <button id="btnReset">Reset</button>
      <button id="btnPause">Pause</button>
    </div>
  </div>
  <div class="takeaway">
    <strong>Exam takeaway:</strong> Gas particles move randomly and hit the container walls, creating pressure. Squeeze the gas into a smaller volume and the pressure rises.
  </div>
  <script>
    var canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var CX = 22, CY = 22, CW = 480, CH = 356, RADIUS = 6, PISTON_THICK = 14;
    var particles = [], flashes = [];
    var temperature = 1.0, volume = 1.0, paused = false;
    var displayedPressure = 100, BAR_MAX = 500;
    var NUM_PARTICLES = 40, FLASH_LIFE = 0.30;
    function speedFromTemp(t) { return 120 * t; }
    function rightWallX() { return CX + CW * volume; }
    function initParticles() {
      particles = [];
      var rwx = rightWallX(), innerW = rwx - CX - 2 * RADIUS;
      for (var i = 0; i < NUM_PARTICLES; i++) {
        var angle = Math.random() * Math.PI * 2, speed = speedFromTemp(temperature);
        particles.push({ x: CX + RADIUS + Math.random() * innerW, y: CY + RADIUS + Math.random() * (CH - 2 * RADIUS), vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed });
      }
    }
    function setTemperature(t) {
      temperature = t;
      var speed = speedFromTemp(t);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i], s = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (s > 0) { p.vx = p.vx / s * speed; p.vy = p.vy / s * speed; }
        else { var a = Math.random() * Math.PI * 2; p.vx = Math.cos(a) * speed; p.vy = Math.sin(a) * speed; }
      }
    }
    function recordHit(x, y) { flashes.push({ x: x, y: y, life: FLASH_LIFE, maxLife: FLASH_LIFE }); }
    function update(dt) {
      var rwx = rightWallX();
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x - RADIUS < CX) { p.x = CX + RADIUS; if (p.vx < 0) { p.vx = -p.vx; recordHit(CX, p.y); } }
        if (p.x + RADIUS > rwx) { p.x = rwx - RADIUS; if (p.vx > 0) { p.vx = -p.vx; recordHit(rwx, p.y); } }
        if (p.y - RADIUS < CY) { p.y = CY + RADIUS; if (p.vy < 0) { p.vy = -p.vy; recordHit(p.x, CY); } }
        if (p.y + RADIUS > CY + CH) { p.y = CY + CH - RADIUS; if (p.vy > 0) { p.vy = -p.vy; recordHit(p.x, CY + CH); } }
      }
      for (var j = flashes.length - 1; j >= 0; j--) { flashes[j].life -= dt; if (flashes[j].life <= 0) flashes.splice(j, 1); }
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      var rwx = rightWallX();
      ctx.fillStyle = '#040a17'; ctx.fillRect(CX, CY, rwx - CX, CH);
      ctx.strokeStyle = '#3a5a8c'; ctx.lineWidth = 5; ctx.lineCap = 'square';
      ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX, CY + CH); ctx.lineTo(rwx, CY + CH); ctx.moveTo(CX, CY); ctx.lineTo(rwx, CY); ctx.stroke();
      ctx.fillStyle = '#5a6f8c'; ctx.fillRect(rwx, CY, PISTON_THICK, CH);
      ctx.strokeStyle = '#3a4f6c'; ctx.lineWidth = 1.5;
      for (var y = CY + 8; y < CY + CH; y += 10) { ctx.beginPath(); ctx.moveTo(rwx + 2, y); ctx.lineTo(rwx + PISTON_THICK - 2, y - 7); ctx.stroke(); }
      ctx.strokeStyle = '#4a5f7c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(rwx, CY); ctx.lineTo(rwx, CY + CH); ctx.stroke();
      var rodStartX = rwx + PISTON_THICK, rodEndX = W - 12, rodY = CY + CH / 2 - 7, rodH = 14;
      if (rodEndX > rodStartX) { ctx.fillStyle = '#4a5f7c'; ctx.fillRect(rodStartX, rodY, rodEndX - rodStartX, rodH); ctx.strokeStyle = '#2a3f5c'; ctx.lineWidth = 1; ctx.strokeRect(rodStartX, rodY, rodEndX - rodStartX, rodH); }
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.beginPath(); ctx.arc(p.x, p.y, RADIUS + 4, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 210, 63, 0.18)'; ctx.fill();
        ctx.beginPath(); ctx.arc(p.x, p.y, RADIUS, 0, Math.PI * 2); ctx.fillStyle = '#ffd23f'; ctx.fill();
      }
      for (var k = 0; k < flashes.length; k++) {
        var f = flashes[k], a = f.life / f.maxLife, rad = 5 + (1 - a) * 14;
        var grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, rad);
        grad.addColorStop(0, 'rgba(255, 255, 255, ' + (a * 0.9) + ')'); grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(f.x, f.y, rad, 0, Math.PI * 2); ctx.fill();
      }
    }
    function updatePressure(dt) {
      var targetP = 100 * temperature / volume;
      var alpha = 1 - Math.exp(-dt / 0.10);
      displayedPressure += alpha * (targetP - displayedPressure);
      var barFill = Math.min(1, displayedPressure / BAR_MAX);
      document.getElementById('meterFill').style.height = (barFill * 100) + '%';
      document.getElementById('pressureNum').textContent = Math.round(displayedPressure);
    }
    var lastTime = performance.now();
    function loop() {
      var now = performance.now(), dt = (now - lastTime) / 1000; lastTime = now; if (dt > 0.1) dt = 0.1;
      if (!paused) update(dt);
      draw(); updatePressure(dt); requestAnimationFrame(loop);
    }
    document.getElementById('tempSlider').addEventListener('input', function (e) { var v = parseFloat(e.target.value); setTemperature(v); document.getElementById('tempVal').textContent = v.toFixed(1); });
    document.getElementById('volSlider').addEventListener('input', function (e) { volume = parseInt(e.target.value, 10) / 100; document.getElementById('volVal').textContent = e.target.value + '%'; });
    document.getElementById('btnReset').addEventListener('click', function () {
      temperature = 1.0; volume = 1.0;
      document.getElementById('tempSlider').value = 1; document.getElementById('volSlider').value = 100;
      document.getElementById('tempVal').textContent = '1.0'; document.getElementById('volVal').textContent = '100%';
      document.getElementById('meterFill').style.height = '20%'; document.getElementById('pressureNum').textContent = '100';
      flashes = []; initParticles();
    });
    document.getElementById('btnPause').addEventListener('click', function () { paused = !paused; this.textContent = paused ? 'Play' : 'Pause'; this.classList.toggle('active', paused); });
    initParticles(); document.getElementById('meterFill').style.height = '20%'; loop();
  </script>
</body>
</html>
