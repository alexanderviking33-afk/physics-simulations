<!DOCTYPE html>
<html>
<head>
  <title>Conservation of Momentum</title>
  <style>
    body { background-color: #0b1d3a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 12px; }
    h1 { color: #ffd23f; font-size: 24px; margin: 0 0 4px 0; }
    .subtitle { color: #9fd3ff; font-size: 13px; margin: 0 0 10px 0; }
    .mode-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
    .mode-btn { font-family: Arial; font-size: 14px; font-weight: bold; padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer; background-color: #4a5a7c; color: #fff; }
    .mode-btn.active { background-color: #ffd23f; color: #0b1d3a; }
    canvas { background-color: #060f22; border-radius: 12px; display: block; margin: 0 auto 10px auto; border: 2px solid #3a5a8c; }
    .controls { display: flex; justify-content: center; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
    .car-controls { background-color: #132a4f; border-radius: 10px; padding: 10px 14px; min-width: 200px; }
    .car-controls h3 { margin: 0 0 6px 0; font-size: 14px; }
    .car1 h3 { color: #ff6b6b; } .car2 h3 { color: #6db8ff; }
    .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 13px; }
    .ctrl-row label { color: #9fd3ff; min-width: 60px; text-align: left; }
    .ctrl-row input[type="range"] { width: 100px; accent-color: #ffd23f; }
    .ctrl-row span { color: #ffd23f; font-weight: bold; min-width: 45px; text-align: right; }
    button.action { font-family: Arial; font-size: 14px; font-weight: bold; padding: 8px 24px; border: none; border-radius: 8px; cursor: pointer; color: #0b1d3a; background-color: #ffd23f; }
    button.action:disabled { background-color: #4a5a7c; color: #9fb0cc; }
    .panel { display: inline-block; background-color: #132a4f; border-radius: 10px; padding: 10px 20px; margin-bottom: 10px; font-size: 13px; text-align: left; max-width: 750px; }
    .row { margin: 3px 0; }
    .row .label { font-weight: bold; }
    .before .label { color: #6db8ff; } .after .label { color: #7be495; }
    .row .eq { color: #ffd23f; font-family: 'Courier New'; font-weight: bold; margin-left: 6px; }
    .check { color: #7be495; font-weight: bold; margin-top: 4px; }
    .check.warn { color: #ff8c42; }
    .ke-section { margin-top: 8px; padding-top: 6px; border-top: 1px solid #2a4a7c; }
    .takeaway { display: inline-block; background-color: #1c3d6e; border: 2px solid #ffd23f; border-radius: 10px; padding: 8px 18px; font-size: 13px; max-width: 750px; }
    .takeaway strong { color: #ffd23f; }
  </style>
</head>
<body>
  <h1>Conservation of Momentum</h1>
  <p class="subtitle">Two cars collide — is kinetic energy conserved too?</p>
  <div class="mode-buttons">
    <button id="mElastic" class="mode-btn active">Elastic (bounce)</button>
    <button id="mInelastic" class="mode-btn">Inelastic (stick)</button>
  </div>
  <canvas id="canvas" width="700" height="250"></canvas>
  <div class="controls">
    <div class="car-controls car1">
      <h3>Car 1 (red)</h3>
      <div class="ctrl-row"><label>m₁</label><input type="range" id="m1" min="1" max="10" value="4"><span id="m1v">4 kg</span></div>
      <div class="ctrl-row"><label>u₁</label><input type="range" id="u1" min="-5" max="5" value="3"><span id="u1v">+3</span></div>
    </div>
    <div class="car-controls car2">
      <h3>Car 2 (blue)</h3>
      <div class="ctrl-row"><label>m₂</label><input type="range" id="m2" min="1" max="10" value="6"><span id="m2v">6 kg</span></div>
      <div class="ctrl-row"><label>u₂</label><input type="range" id="u2" min="-5" max="5" value="-2"><span id="u2v">−2</span></div>
    </div>
  </div>
  <div style="margin-bottom:10px;">
    <button id="startBtn" class="action">Start</button>
    <button id="resetBtn" class="action">Reset</button>
  </div>
  <div class="panel">
    <div class="row before"><span class="label">Momentum BEFORE:</span><span class="eq" id="pB">m₁u₁ + m₂u₂ = ?</span></div>
    <div class="row after"><span class="label">Momentum AFTER:</span><span class="eq" id="pA">m₁v₁ + m₂v₂ = ?</span></div>
    <div class="check" id="chk">↑ Press Start</div>
    <div class="ke-section">
      <div class="row before"><span class="label">KE BEFORE:</span><span class="eq" id="keB">0.5m₁u₁² + 0.5m₂u₂² = ?</span></div>
      <div class="row after"><span class="label">KE AFTER:</span><span class="eq" id="keA">0.5m₁v₁² + 0.5m₂v₂² = ?</span></div>
      <div class="check" id="keChk"></div>
    </div>
  </div>
  <div class="takeaway" id="takeaway"></div>
  <script>
    var canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height, SCALE = 35, SX1 = 100, SX2 = W-100, CW = 80, CH = 40, CY = 180;
    var car1 = { x: SX1, mass: 4, u: 3, v: 0, color: '#e63946', name: 'Car 1' };
    var car2 = { x: SX2, mass: 6, u: -2, v: 0, color: '#4ea8de', name: 'Car 2' };
    var state = 'ready', mode = 'elastic', flash = 0, flashX = 0;

    function fn(v) { if (Math.abs(v)<0.05) return '0'; return (v<0?'−':'+') + (Math.abs(v)%1===0?Math.abs(v):Math.abs(v).toFixed(1)); }
    function fp(v) { if (Math.abs(v)<0.05) return '0'; return (v<0?'−':'') + (Math.abs(v)%1===0?Math.abs(v):Math.abs(v).toFixed(1)); }
    function fsq(v) { var s = Math.abs(v)<0.05?'0':(Math.abs(v)%1===0?Math.abs(v):Math.abs(v).toFixed(1)); return v<-0.05 ? '('+s+')²' : s+'²'; }

    function calcFinals() {
      var m1=car1.mass, u1=car1.u, m2=car2.mass, u2=car2.u;
      if (mode === 'elastic') {
        car1.v = ((m1-m2)*u1 + 2*m2*u2) / (m1+m2);
        car2.v = ((m2-m1)*u2 + 2*m1*u1) / (m1+m2);
      } else {
        var vc = (m1*u1 + m2*u2) / (m1+m2);
        car1.v = vc; car2.v = vc;
      }
    }

    function rr(x,y,w,h,r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }

    function drawCar(c) {
      var l = c.x - CW/2, t = CY - CH/2, b = t + CH;
      ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(l+CW*0.25,b,7,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(l+CW*0.75,b,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = c.color; rr(l,t,CW,CH,6); ctx.fill();
      ctx.fillStyle = '#c8d8f0'; rr(l+CW*0.2,t+6,CW*0.25,CH*0.35,2); ctx.fill(); rr(l+CW*0.55,t+6,CW*0.25,CH*0.35,2); ctx.fill();
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = '#1e2f4f'; ctx.fillRect(0, CY+CH/2+8, W, 16);
      drawCar(car1); drawCar(car2);
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'left'; ctx.fillStyle = '#e63946'; ctx.fillText('Car 1', 20, 25);
      ctx.fillStyle = '#fff'; ctx.font = '13px Arial'; ctx.fillText('m₁ = '+car1.mass+' kg', 20, 45);
      ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 13px Arial'; ctx.fillText('u₁ = '+fn(car1.u)+' m/s', 20, 65);
      if (state === 'collided') { ctx.fillStyle = '#7be495'; ctx.fillText('v₁ = '+fn(car1.v)+' m/s', 20, 85); }
      ctx.textAlign = 'right'; ctx.fillStyle = '#4ea8de'; ctx.font = 'bold 14px Arial'; ctx.fillText('Car 2', W-20, 25);
      ctx.fillStyle = '#fff'; ctx.font = '13px Arial'; ctx.fillText('m₂ = '+car2.mass+' kg', W-20, 45);
      ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 13px Arial'; ctx.fillText('u₂ = '+fn(car2.u)+' m/s', W-20, 65);
      if (state === 'collided') { ctx.fillStyle = '#7be495'; ctx.fillText('v₂ = '+fn(car2.v)+' m/s', W-20, 85); }

      if (flash > 0) {
        var a = flash/0.5, r = 25+(1-a)*60;
        var g = ctx.createRadialGradient(flashX, CY, 0, flashX, CY, r);
        g.addColorStop(0,'rgba(255,230,100,'+(a*0.9)+')'); g.addColorStop(1,'rgba(255,200,80,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(flashX, CY, r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,240,150,'+a+')'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.fillText('BOOM!', flashX, CY-50);
      }

      ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
      ctx.fillStyle = mode === 'elastic' ? '#7be495' : '#ff8c42';
      ctx.fillText(mode === 'elastic' ? 'ELASTIC' : 'INELASTIC', W/2, 18);
    }

    function update(dt) {
      if (state === 'moving') {
        car1.x += car1.u*SCALE*dt; car2.x += car2.u*SCALE*dt;
        if (Math.abs(car2.x - car1.x) <= CW) {
          var m = (car1.x+car2.x)/2; car1.x = m-CW/2; car2.x = m+CW/2;
          flashX = m; flash = 0.5; state = 'collided';
          calcFinals(); updatePanel();
        }
      } else if (state === 'collided') {
        car1.x += car1.v*SCALE*dt; car2.x += car2.v*SCALE*dt;
      }
      if (flash > 0) flash -= dt;
    }

    function updatePanel() {
      var pB = car1.mass*car1.u + car2.mass*car2.u;
      document.getElementById('pB').textContent = 'm₁u₁ + m₂u₂ = ('+car1.mass+')×('+fp(car1.u)+') + ('+car2.mass+')×('+fp(car2.u)+') = '+fp(pB)+' kg m/s';
      var keB = 0.5*car1.mass*car1.u*car1.u + 0.5*car2.mass*car2.u*car2.u;
      document.getElementById('keB').textContent = '0.5×'+car1.mass+'×'+fsq(car1.u)+' + 0.5×'+car2.mass+'×'+fsq(car2.u)+' = '+keB.toFixed(1)+' J';
      var chk = document.getElementById('chk'), keChk = document.getElementById('keChk');
      if (state === 'collided') {
        var pA = car1.mass*car1.v + car2.mass*car2.v;
        document.getElementById('pA').textContent = 'm₁v₁ + m₂v₂ = ('+car1.mass+')×('+fp(car1.v)+') + ('+car2.mass+')×('+fp(car2.v)+') = '+fp(pA)+' kg m/s';
        chk.textContent = '✓ Momentum conserved: '+fp(pB)+' = '+fp(pA);
        chk.classList.remove('warn');
        var keA = 0.5*car1.mass*car1.v*car1.v + 0.5*car2.mass*car2.v*car2.v;
        document.getElementById('keA').textContent = '0.5×'+car1.mass+'×'+fsq(car1.v)+' + 0.5×'+car2.mass+'×'+fsq(car2.v)+' = '+keA.toFixed(1)+' J';
        if (Math.abs(keA-keB) < 0.2) { keChk.textContent = '✓ Kinetic energy conserved — ELASTIC'; keChk.className = 'check'; }
        else { keChk.textContent = '⚠ KE lost ('+keB.toFixed(1)+' J → '+keA.toFixed(1)+' J) — INELASTIC'; keChk.className = 'check warn'; }
      } else {
        document.getElementById('pA').textContent = 'm₁v₁ + m₂v₂ = ? (press Start)';
        document.getElementById('keA').textContent = '0.5×m₁v₁² + 0.5×m₂v₂² = ? (press Start)';
        chk.textContent = '↑ Press Start'; chk.classList.remove('warn');
        keChk.textContent = ''; keChk.className = 'check';
      }
    }

    function updateTakeaway() {
      var t = document.getElementById('takeaway');
      t.innerHTML = mode === 'elastic'
        ? '<strong>Exam takeaway:</strong> In an <strong>elastic</strong> collision, both momentum AND kinetic energy are conserved.'
        : '<strong>Exam takeaway:</strong> In an <strong>inelastic</strong> collision, momentum is conserved, but kinetic energy is lost (as heat and sound).';
    }

    function refresh() {
      document.getElementById('m1v').textContent = car1.mass+' kg';
      document.getElementById('m2v').textContent = car2.mass+' kg';
      document.getElementById('u1v').textContent = fn(car1.u);
      document.getElementById('u2v').textContent = fn(car2.u);
      updatePanel();
    }

    function setEnabled(en) {
      ['m1','u1','m2','u2'].forEach(function(id) { document.getElementById(id).disabled = !en; });
    }

    function reset() {
      state = 'ready'; car1.x = SX1; car2.x = SX2; car1.v = 0; car2.v = 0; flash = 0;
      setEnabled(true); document.getElementById('startBtn').disabled = false;
      updatePanel(); updateTakeaway();
    }

    function start() {
      if (state !== 'ready') return;
      if (car1.u <= car2.u) {
        var c = document.getElementById('chk');
        c.textContent = '⚠ Cars will not collide — set u₁ larger than u₂'; c.classList.add('warn');
        return;
      }
      calcFinals(); state = 'moving'; setEnabled(false);
      document.getElementById('startBtn').disabled = true; updatePanel();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('mElastic').classList.toggle('active', m === 'elastic');
      document.getElementById('mInelastic').classList.toggle('active', m === 'inelastic');
      reset();
    }

    document.getElementById('m1').addEventListener('input', function(e) { car1.mass = parseInt(e.target.value); refresh(); });
    document.getElementById('u1').addEventListener('input', function(e) { car1.u = parseInt(e.target.value); refresh(); });
    document.getElementById('m2').addEventListener('input', function(e) { car2.mass = parseInt(e.target.value); refresh(); });
    document.getElementById('u2').addEventListener('input', function(e) { car2.u = parseInt(e.target.value); refresh(); });
    document.getElementById('startBtn').addEventListener('click', start);
    document.getElementById('resetBtn').addEventListener('click', reset);
    document.getElementById('mElastic').addEventListener('click', function() { setMode('elastic'); });
    document.getElementById('mInelastic').addEventListener('click', function() { setMode('inelastic'); });

    var last = performance.now();
    function loop() {
      var now = performance.now(), dt = (now-last)/1000; last = now; if (dt > 0.1) dt = 0.1;
      update(dt); draw(); requestAnimationFrame(loop);
    }
    refresh(); updateTakeaway(); loop();
  </script>
</body>
</html>
